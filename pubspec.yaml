name: shule_drive
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.10.3


dependencies:
  flutter:
    sdk: flutter

  
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  url_launcher: ^6.3.0
  mqtt_client: ^10.11.9
  uuid: ^4.5.2
  intl: ^0.20.2
  intl_phone_field: ^3.2.0
  animated_splash_screen: ^1.3.0
  page_transition: ^2.2.1
  flutter_launcher_icons: ^0.14.4
  http: ^1.6.0
  http_parser: ^4.0.2
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  permission_handler: ^11.3.0
  
  # Maps & Location
  flutter_polyline_points: ^2.1.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  
  # Free OpenStreetMap Alternative
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^1.4.0
  
  # Mapbox Official SDK
  mapbox_maps_flutter: ^2.11.0
  
  # Push Notifications (Choose your backend)
  # OPTION 1: Firebase (Google) - Uncomment to use
  # firebase_core: ^3.1.0
  # firebase_messaging: ^15.0.1
  
  # OPTION 2: OneSignal (Alternative) - Uncomment to use
  # onesignal_flutter: ^5.2.8
  
  # REQUIRED: Local notifications (works with all backends)
  flutter_local_notifications: ^17.1.2
  
  # Offline Database & Connectivity
  sqflite: ^2.3.3+1
  path: ^1.9.0
  connectivity_plus: ^6.0.3
  workmanager: ^0.9.0
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - images/
    - assets/
    - assets/images/
    - assets/chat_bg.jpg
    - assets/dark_chat_bg.jpg
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "images/logo.png"

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Custom fonts. Inter (UI/body) and Plus Jakarta Sans (display headings).
  # Both are variable fonts — Flutter maps FontWeight to the `wght` axis,
  # so a single asset per family covers all weights.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
